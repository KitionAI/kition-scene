[package]
name = "kition-scene"
description = "The Scene kit for Kition's agent: the Kition SDK document served headless over the Kit Protocol."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
kition-scene-kit = { path = "../wasm" }
kition-headless = { workspace = true }

[dev-dependencies]
kition-kit = { workspace = true, features = ["session"] }
kition-kit-server = { workspace = true }
serde_json = { workspace = true }
# ids.rs and outside.rs drive the kit through the kits' MCP server's tools, as an agent does.
kition-kits = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
zip = { workspace = true }
