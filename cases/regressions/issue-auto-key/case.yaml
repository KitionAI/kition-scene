format: 1
id: regressions/issue-auto-key
feature: scene.editor.fields-animation
intent: >-
  Auto-keying is the person's view state (transform.set's autoKey, the timeline's record button):
  with it on, a confirmed transform keys what it changed at the current frame in its own undo step
  (a move the location only), and one undo takes the transform and its keys back; with it off,
  nothing is keyed. Before, there was no auto-keying.
