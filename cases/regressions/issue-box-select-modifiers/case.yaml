id: regressions/issue-box-select-modifiers
feature: scene.editor.basics
intent: >-
  Shift with a box adds what it finds to the selection, Cmd/Ctrl takes it away, both keep what is
  in both, and a plain box sets the selection (Blender's Select Box modes); Shift with a click
  still toggles. Before, Shift with a box toggled, so what was selected and inside the box was
  unselected.
