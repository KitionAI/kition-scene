format: 1
id: regressions/issue-command-click-origin
feature: scene.editor.basics
intent: >-
  Cmd/Ctrl+click picks the object whose origin is drawn nearest the pointer (within 75 pixels),
  not the surface under it, and with Shift adds it, as Blender's Ctrl+click does. Before,
  Cmd+click replaced the selection with the surface under the pointer and Ctrl+click did nothing.
