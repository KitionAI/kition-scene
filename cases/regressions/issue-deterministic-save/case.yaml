format: 1
id: regressions/issue-deterministic-save
feature: scene.agent.act
intent: >-
  A document built by the same commands saves the same bytes when SOURCE_DATE_EPOCH is set (a
  showcase sample, a gate case): the document id, the replica's actor and new objects' ids are
  counted from the epoch (kition-sdk e2fec7e), so no build of a sample saves another docId,
  actor or object ids.
layer: gate
source:
  kind: probe
  from: kition-showcase sample rebuilds (a scene sample must save the same bytes on every build)
  license: owned
input: []
steps:
  - cargo-test: { package: kition-scene-kit, test: deterministic_save }
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0
since: "2026-11-17"
