intent: >-
  Focus shows the viewport alone: the timeline and the Graph, NLA, Node, and UV editors are the
  kit's own bars and leave with the rest of the chrome, so the Focus bar never sits on the
  timeline's keying set and frame field. Single line and Classic open on Add (Cube, UV Sphere,
  Cylinder, Plane, Light, Camera in Single line's row), not on File, whose row is one button.
