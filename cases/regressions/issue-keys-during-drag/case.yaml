id: regressions/issue-keys-during-drag
feature: scene.editor.basics
intent: >-
  While the left button holds a tool's drag in the viewport, keys run no shortcut: X pressed
  during a drag of the Move tool deletes nothing, the drag ends as one Move step, and one undo
  puts the cube back where it was. Before, X deleted the object being moved; on release it came
  back and the undo stack read Delete then Move.
