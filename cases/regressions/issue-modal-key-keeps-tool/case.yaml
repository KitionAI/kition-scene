format: 1
id: regressions/issue-modal-key-keeps-tool
feature: scene.editor.modal-transform
intent: >-
  G, R and S from the keyboard (and Shift+D) pick their tool only while the transform they start
  runs: when it ends (a click, Enter, the right button, Escape), the tool that was active before
  the key comes back, so after G, a move and a click, a drag on empty space box-selects again as
  in Blender. A press handed to the tool (G, then a drag before anything changed) keeps the tool
  the key picked. Before, the Move, Rotate or Scale tool stayed picked and the next drag on empty
  space moved the selection (item 20 of the first ten minutes' checklist).
