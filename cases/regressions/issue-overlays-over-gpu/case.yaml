format: 1
id: regressions/issue-overlays-over-gpu
feature: scene.editor.basics
intent: >-
  The tools' overlays (the select box, the rotate and scale readouts and their dashed line, the
  loop cut's loop, the knife, proportional editing's circle) show over the GPU picture, on a layer
  of the viewport's own, and a drag's readout stays while the editor asks the tools for their
  state after each change. Before, they were drawn only on the hidden software picture, and the
  state's answer dropped the drag's readout even there.
