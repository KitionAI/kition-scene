format: 1
id: regressions/issue-pause-frame-in-flight
feature: scene.editor.fields-animation
intent: >-
  A tap of Space that pauses playback leaves the scene at the frame the timeline showed when it
  was tapped, also on a scene heavy enough that a frame takes a while to show. Before, the frame
  asked for just before the pause landed afterwards and moved the pause on: by eleven frames on
  the CI runner's default scene, by about thirty on a 380,000-vertex scene on a fast machine. The
  timeline marks itself while a frame is on its way (data-seeking), which the tests wait for.
