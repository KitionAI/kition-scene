format: 1
id: regressions/issue-right-click-selects
feature: scene.editor.basics
intent: >-
  A right click on an object that is not selected selects it before the context menu opens, so the
  menu's Duplicate and Delete act on it; a right click on a selected object keeps the selection,
  and on nothing changes nothing. Before, the menu opened over whatever was selected, or over
  nothing.
