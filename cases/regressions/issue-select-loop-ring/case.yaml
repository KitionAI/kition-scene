  from: kition-plan kit-docs/scene/walkthrough/findings.md, N11 (plan scene-usable-by-hand, phase 6)
  license: owned
input: []
steps:
  - cargo-test:
      package: kition-scene-kit
      test: select
      filter: loops_rings_and_face_loops_follow_the_quads
expected:
  - actual: out:exit
    compare: exit
    value: 0
since: "2026-11-26"
timeout_s: 300
