format: 1
id: regressions/issue-select-loop-ring
feature: scene.editor.selection
intent: >-
  In a mesh's edit mode select.loop takes the edge loop through the edge under the pointer (Alt+click; in face mode the loop of faces across it) and select.ring the ring of edges across the quads beside it (Ctrl+Alt+click); extend adds. Before, there were no loop or ring selects.
layer: gate
source:
