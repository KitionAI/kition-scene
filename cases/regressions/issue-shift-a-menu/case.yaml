format: 1
id: regressions/issue-shift-a-menu
feature: scene.editor.interface
intent: >-
  Shift+A opens the Add menu at the pointer (Mesh, Curve and Light submenus, Text, Armature,
  Lattice, Empty, Camera); a cylinder chosen there lands at the 3D cursor and shows in Adjust Last
  Operation. F3 opens a search over the commands the mode can run (name, menu path, key) and
  Enter runs the lit one; Z opens the shading pie, chosen by a click or by holding Z toward an item
  and letting go; T and N show and hide the toolbar and the side panel. Before, these keys did
  nothing.
