format: 1
id: regressions/issue-trackpad-orbit
feature: scene.editor.navigation
intent: >-
  A trackpad's two fingers orbit the view, with Shift they pan, with Ctrl/Cmd or a pinch they
  zoom; a mouse wheel (a vertical scroll in whole pixels) still zooms; Ctrl+middle drag zooms. A
  scroll with a sideways part or a fraction of a pixel is a trackpad's. Before, every scroll
  zoomed, sideways scrolls did nothing and Ctrl+middle drag orbited.
