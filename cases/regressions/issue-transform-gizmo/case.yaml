format: 1
id: regressions/issue-transform-gizmo
feature: scene.editor.transform-tools
intent: >-
  The Move, Rotate and Scale tools show their gizmo at the pivot point: a handle under the pointer
  lights up; dragging an arrow moves along its axis only, a square in its plane only, a ring turns
  about its axis, a box-ended axis scales along it; the release confirms one undo step and the
  right button cancels; a press on the middle is the tool's own free drag. Before, the tools had
  no handles at all.
