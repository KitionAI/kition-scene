format: 1
id: regressions/issue-undo-after-menu
feature: scene.editor.navigation
intent: >-
  Ctrl/Cmd+Z right after choosing a row of a menu at the pointer (edit mode's Delete menu)
  undoes that row's command. The frame keeps a list of which commands can run, which follows a
  change one call to the engine later, and dropped a Ctrl/Cmd shortcut whose command it still
  thought disabled (Undo, before the first change); the editor now asks the engine. Before, the
  Ctrl+Z did nothing.
