format: 1
id: scene.agent.act/red-material
feature: scene.agent.act
intent: >-
  The agent replaces the cube's material: a new red material on the Cube, and the old one, then
  unused, deleted. `material.new` gives a new material to the selection unless told otherwise,
  and a material in use is only deleted with `force`; the guide warns about both.
layer: eval
source:
  kind: synthetic
  from: repo:conformance/basic.kscene
  license: Apache-2.0
  note: A copy of the conformance fixture the scene engine writes.
input: [input/scene.kscene]
steps:
  - task:
      prompt: >-
        In scene.kscene, give the Cube a new pure red material named "Red", and delete the old
        material "Material", which nothing should use afterwards.
      max_turns: 20
  - inspect: { path: scene.kscene, as: after }
  - check: { path: scene.kscene, as: diagnostics }
expected:
  - actual: out:after
    compare: values
    value:
      details.materials: { count: 1 }
      details.materials.0.name: Red
      details.materials.0.baseColor.0: { approx: 1, tol: 0.01 }
      details.materials.0.baseColor.1: { approx: 0, tol: 0.01 }
      details.materials.0.baseColor.2: { approx: 0, tol: 0.01 }
      details.materials.0.users: 1
  - actual: out:diagnostics
    compare: diagnostics
    value: { absent: [scene.unusedMaterial], max_errors: 0 }
  - actual: out:after
    compare: values
    collateral: true
    value:
      details.objects.0.name: Cube
      details.objects.0.location: [0, 0, 0]
      details.objects.0.mesh.faces: 6
      details.objects.1.name: Light
      details.objects.1.location.0: { approx: 4.0763, tol: 0.001 }
      details.objects.2.name: Camera
      details.objects.2.location.0: { approx: 7.3589, tol: 0.001 }
solution:
  - tool: scene_run
    args:
      path: scene.kscene
      steps:
        - { command: material.new, params: { name: Red, baseColor: [1, 0, 0], assign: false } }
        - { command: material.assign, params: { material: Red, objects: Cube } }
        - { command: material.delete, params: { material: Material } }
since: "2026-11-17"
timeout_s: 600
