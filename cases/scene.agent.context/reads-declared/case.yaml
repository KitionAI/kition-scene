format: 1
id: scene.agent.context/reads-declared
feature: scene.agent.context
intent: >-
  Every command declares the editor state its code reads (`x-khp-reads`: the selection, the
  current frame; and in the kit's own record, the mode and what it selects, which kition-sdk has no
  kind for), derived by following each command's code through the kit to the accessors of the
  selection and active object, the current frame and the mode; the commands are the ones the
  document lists at run time, and a command whose declaration differs from its code fails.
