format: 1
id: scene.agent.premises/per-call
feature: scene.agent.premises
intent: >-
  The kit states what each call reads or replaces for the command families whose code was read
  (transforms, object properties, materials, modifiers and constraints by index, vertex groups and
  shape keys, transform keys, light and camera settings, parenting): with real outside changes, a
  change inside the premise refuses the agent's write with basis and a change outside it applies; a
  modifier or constraint inserted above the one a write names by index refuses it; a write by name
  holds the name; a batch cannot set an object's kind, parent or material.
