feature: scene.agent.preview
intent: >-
  Served headless, kit.json names file.render as the agent's render command and the agent runs it
  without changing the document; what view.describe answers (scene_inspect's details) leaves out
  the editor's state (viewport, mode, selection, tool, the selected objects' key frames), so
  orbiting the viewport, selecting objects or entering edit mode changes nothing the agent reads
  of the scene, while the keyframes stay in it.
