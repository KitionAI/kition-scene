format: 1
id: scene.file.content-only/no-history
feature: scene.file.content-only
intent: >-
  A scene whose change log holds typed-then-deleted text (a 3D text's body), a deleted object and
  an overwritten name saves to a .kscene whose content entry (content.json) holds the state, no
  version, lineage, actor or origin, and none of those strings, each found in the session's change
  log first; an unchanged scene saves to the same bytes, twice, after markSaved and from the file
  opened again, which holds the same objects under the same ids; through the headless kit, an
  agent's batches save files holding no history.
layer: gate
source:
  kind: synthetic
  from: bindings/wasm/tests/content_file.rs (an_unchanged_scene_saves_to_the_same_bytes_and_its_content_holds_no_history, an_unchanged_scene_saves_to_the_same_bytes), bindings/headless/tests/content_file.rs
  license: Apache-2.0
input: []
steps:
  - cargo-test: { package: kition-scene-kit, test: content_file, filter: an_unchanged_scene_saves_to_the_same_bytes }
  - cargo-test: { package: kition-scene, test: content_file }
expected:
  - actual: out:cargo-test
    compare: exit
    value: 0
