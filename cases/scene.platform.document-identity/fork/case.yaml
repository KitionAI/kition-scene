format: 1
id: scene.platform.document-identity/fork
feature: scene.platform.document-identity
intent: >-
  Through the real kition-scene process: document.identity answers the docId a .kscene carries
  (its content.json's), and a byte copy answers the same one; document.fork writes a new document
  to a new file: a new docId (in meta.json too), the same objects, ids and values (model.batch),
  content with no history whose docId is the fork's, a replica that travels as a draft, the blobs the scene references and none it
  does not, and no other entry (a .kscene holds no editor state); the name of an object deleted before the save is in the
  first save and in neither file;
  the fork edits, saves and reopens under its own id; a fork of the fork is a third document; a
  fork never replaces an existing file.
