  - repo:crates/engine/model/tests/fixtures/uv7-complex-reference.json
steps:
  - cargo-test: { package: kition-scene-model, test: uv7 }
expected:
  - { actual: "out:steps", compare: exit, value: 0 }
reference:
  - id: blender
    tool: UPSTREAM
    version: "Blender 5.2.3 LTS"
    platform: macOS arm64
    made: "2026-10-30"
    how: Run tests/blender/uv7.py through the Blender application, MINIMUM_STRETCH, 50 iterations, No Flip on, no fill holes or aspect correction. Tests use committed recordings offline; energy within 3 percent, mean angle difference within 0.03 radians, mean log-area difference within 0.05, pinned chart coordinates within 0.03 UV units and each pin exact. Packing permits free chart rotation and scale; the objective metric removes uniform UV scale.
    kind: external
since: "2026-11-17"
