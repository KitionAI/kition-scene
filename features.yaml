features:
  - id: scene.mesh.smooth-by-angle
    title: Shade Smooth by Angle (split normals at sharp edges)
    dimension: [function, fidelity, conversion]
    priority: P1
    status: has
    commands: [object.shadeSmoothByAngle, object.shadeSmooth, object.shadeFlat]
    paths: [crates/engine/model/src/mesh.rs, crates/engine/model/src/tangents.rs, crates/kdm/kdm-model/src/mesh_blob.rs, crates/render/raster/src/cache.rs, crates/render/raster/src/lib.rs, crates/render/trace/src/lib.rs, bindings/wasm/src/gl.rs, crates/formats/exchange/src/gltf.rs, crates/formats/fbx/src/export.rs, crates/formats/usd/src/export.rs, web/src/SidePanel.tsx]
    target: Blender 5.2.3 LTS
    gap: The angle is a mesh setting rather than the reference's Smooth by Angle modifier or marked sharp edges; no Keep Sharp Edges option, and imports do not read sharp edges. Normals are area-weighted, as plain smooth shading here.
    cases: [scene.mesh.smooth-by-angle/split-normals]
    since: "2026-11-17"
  - id: scene.render.ambient-occlusion
    title: Ambient occlusion settings for fast renders
    dimension: [function, fidelity]
    priority: P1
    status: has
    commands: [render.set, render.image]
    paths: [crates/engine/model/src/scene.rs, crates/render/raster/src/lib.rs, crates/render/raster/src/ao.rs, bindings/wasm/src/commands.rs, web/src/SidePanel.tsx]
    target: Blender 5.2.3 LTS
    gap: Screen-space estimate from the depth picture; the automatic distance (6 % of the scene's diagonal, 0.05 to 2 m) stays the default rather than the reference's fixed 0.2 m, so existing renders keep their look. No bent normals or bounce approximation; path-traced renders ignore these settings.
    cases: [scene.render.ambient-occlusion/settings]
    since: "2026-11-17"
  - id: scene.render.color-management
    title: Colour management of renders (view transform, look, exposure)
    dimension: [function, fidelity]
    priority: P1
    status: has
    commands: [render.set, render.image, render.trace.start]
    paths: [crates/engine/model/src/color.rs, crates/render/raster/src/lib.rs, crates/render/trace/src/lib.rs, bindings/wasm/src/commands_compositor.rs, bindings/wasm/src/commands_render.rs, web/src/SidePanel.tsx]
    target: Blender 5.2.3 LTS
    gap: Standard stays the default (the reference's new files use AgX). AgX is a published polynomial approximation rather than the reference's configuration; no Filmic, False Color, Raw, display gamma, white balance, or curves. Only the rendered viewport and final renders are colour managed, not the material view.
    cases: [scene.render.color-management/view-transforms]
    since: "2026-11-17"
  - id: scene.nodes.spline-types
    title: Geometry-node Catmull-Rom and NURBS splines
    dimension: [function, fidelity, conversion, robustness, performance]
    priority: P1
    status: has
    commands: [node.describe, node.addNode, node.setValue, node.link]
    paths: [crates/engine/nodes/src/**, crates/engine/model/src/node_tree.rs, web/src/NodeEditor.tsx, web/src/NodeEditorStrings.ts]
    target: Blender 5.2.3 LTS
    gap: NURBS to Bezier requires cubic Bezier knots from a prior Bezier or Catmull-Rom conversion and equal positive weights; other NURBS must be resampled to Poly first. NURBS order is limited to 16, weights to 100000000, and new spline coordinates, radius and tilt to magnitude 1000000000000. No custom knot vectors or object-curve type changes.
    cases: [scene.nodes.spline-types/blender-and-commands, scene.nodes.spline-types/editor-flow, regressions/issue-curves10-vector-trim]
    since: "2026-11-17"
  - id: scene.physics.effector-weights
    title: Independent cloth and soft-body field weights
    dimension: [function, fidelity, conversion, robustness]
    priority: P1
    status: has
    commands: [physics.cloth.add, physics.cloth.set, physics.softBody.add, physics.softBody.set, physics.bake, physics.bakeStep, physics.free]
    paths: [crates/engine/model/src/physics_weights.rs, crates/engine/model/src/physics.rs, crates/engine/physics/src/bake.rs, crates/engine/physics/src/cloth.rs, crates/engine/physics/src/soft.rs, bindings/wasm/src/commands_field_weights.rs, bindings/wasm/src/commands_physics.rs, bindings/wasm/src/described.rs, web/src/EffectorWeights.tsx, web/src/PhysicsInfo.ts, web/src/PhysicsPanel.tsx, web/src/PhysicsPanel.css]
    target: Blender 5.2.3 LTS
    gap: Cloth and soft bodies only, for the five existing field kinds; weight-transfer identities match public observations while the existing solvers retain their trajectory and flow limitations. No particle, hair, rigid-world, fluid, collection-filter or unsupported-field weights.
    cases: [scene.physics.effector-weights/blender-and-round-trip, scene.physics.effector-weights/editor-flow, scene.physics.effector-weights/released-spline-editing, regressions/issue-fields10-extreme, regressions/issue-fields10-grid, regressions/issue-fields10-schema, regressions/issue-fields10-failure-ui]
    since: "2026-11-17"
