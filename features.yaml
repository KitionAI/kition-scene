    dimension: [function, fidelity, conversion, robustness]
    priority: P1
    status: has
    commands: [camera.set]
    paths: [crates/engine/model/src/scene.rs, crates/render/raster/src/view.rs, crates/render/raster/src/lib.rs, crates/formats/blend/src/lib.rs, crates/formats/exchange/src/gltf.rs, crates/formats/fbx/src/**, crates/formats/usd/src/**, bindings/wasm/src/commands.rs, bindings/wasm/src/commands_compositor.rs, bindings/wasm/src/gl.rs, bindings/wasm/src/inspect.rs, web/src/SidePanel.tsx]
    target: Blender 5.2.3 LTS
    gap: Square pixels only. Exchange formats preserve the fitted frame at matching output aspect, not the editable fit policy or original sensor identity; FBX import retains its existing focal-length limits. Blender 5.2.3 imports native USD orthographic apertures at 10 times their specified span.
    cases: [scene.camera.sensor-fit/blender-and-round-trip, scene.camera.sensor-fit/editor-flow, regressions/issue-camera9-defocus, regressions/issue-camera9-extreme, regressions/issue-camera9-fbx-gate, regressions/issue-camera9-picking, regressions/issue-camera9-portrait-usd]
